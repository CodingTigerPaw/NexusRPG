name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - stable

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type and Svelte check
        run: npm run check

      - name: Build
        run: npm run build
